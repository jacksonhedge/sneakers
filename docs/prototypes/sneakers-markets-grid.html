<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sneakers — Markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FFFFFF; --surface:#F7F9FC; --surface-2:#EEF3FA; --border:#E3E9F2;
    --ink:#0A1B3D; --dim:#5C6B86; --faint:#97A4BC;
    --blue:#1B49D6; --blue-deep:#0A2A6B; --blue-soft:rgba(27,73,214,.08);
    --red:#E0263A; --red-soft:rgba(224,38,58,.09);
    --green:#0EA85A; --green-soft:rgba(14,168,90,.11); --amber:#FFB020;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Inter",-apple-system,system-ui,sans-serif;
    --shadow:0 1px 2px rgba(10,27,61,.04),0 6px 20px rgba(10,27,61,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;line-height:1.45}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:50;
    background:linear-gradient(90deg,var(--blue) 0 38%,#fff 38% 62%,var(--red) 62% 100%)}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px 80px}

  header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 14px;flex-wrap:wrap;gap:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:42px;width:auto;display:block}
  .brand small{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
    border-left:1px solid var(--border);padding-left:10px}
  .status{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .status .live{display:inline-flex;align-items:center;gap:7px}
  .status .live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.8s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .refresh{font-family:var(--sans);font-size:13px;font-weight:600;color:#fff;background:var(--blue);border:none;
    padding:9px 15px;border-radius:10px;cursor:pointer;transition:background .15s,transform .12s}
  .refresh:hover{background:var(--blue-deep);transform:translateY(-1px)}

  .toolbar{display:flex;align-items:center;gap:8px;padding:6px 0 22px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--dim);background:transparent;
    border:1px solid var(--border);padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip:hover{color:var(--ink);border-color:#cdd8ea}
  .chip.active{color:var(--blue);background:var(--blue-soft);border-color:rgba(27,73,214,.3)}
  .toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 6px}
  .toolbar .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}

  .card{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);
    transition:border-color .15s,transform .15s;position:relative;overflow:hidden}
  .card:hover{border-color:#cdd8ea;transform:translateY(-2px)}
  .c-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .c-icon{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--mono);
    font-weight:700;font-size:11px;color:#fff}
  .c-name{font-weight:700;font-size:15px;letter-spacing:-.01em;flex:1}
  .c-ivl{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-soft);
    padding:4px 8px;border-radius:7px}
  .c-src{display:flex;align-items:center;gap:7px;margin-bottom:14px}
  .c-src img{width:16px;height:16px;border-radius:4px;display:block}
  .c-src .nm{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .c-src .badge{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 7px;border-radius:6px}
  .badge.live{color:var(--green);background:var(--green-soft)}
  .badge.settling{color:var(--amber);background:rgba(255,176,32,.12)}
  .badge.upcoming{color:var(--dim);background:var(--surface-2)}

  .c-clock{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .c-clock .lbl{font-size:11px;color:var(--faint)}
  .c-clock .cd{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .c-clock .cd.soon{color:var(--red);animation:pulse .9s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .bar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:14px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#5b82ff);border-radius:999px;transition:width 1s linear}

  .c-prices{display:flex;gap:8px}
  .px{flex:1;text-align:center;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--faint);border:1px solid var(--border);border-radius:9px;padding:9px 4px;
    transition:border-color .2s,background .2s;overflow:hidden}
  /* Robinhood-style odds: clean tabular sans, prominent, live-flashing */
  .px b{display:block;font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
    font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-top:3px;line-height:1.1;transition:color .25s}
  .px b .num{display:inline-block}
  .px.yes.lead{border-color:rgba(14,168,90,.4);color:var(--green);background:var(--green-soft)}
  .px.yes.lead b{color:var(--green)}
  .px.no.lead{border-color:rgba(224,38,58,.4);color:var(--red);background:var(--red-soft)}
  .px.no.lead b{color:var(--red)}
  .px.tick-up b{color:var(--green)!important}
  .px.tick-down b{color:var(--red)!important}
  .px.tick-up b .num,.px.tick-down b .num{animation:roll .34s cubic-bezier(.2,.7,.2,1)}
  @keyframes roll{0%{transform:translateY(-46%);opacity:.15}100%{transform:translateY(0);opacity:1}}

  /* skeleton loading */
  .card.skel{pointer-events:none}
  .sk{background:linear-gradient(90deg,var(--surface-2) 25%,#e7edf6 37%,var(--surface-2) 63%);
    background-size:400% 100%;animation:sh 1.2s ease-in-out infinite;border-radius:8px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-line{height:12px;margin-bottom:10px}
  .sk-icon{width:34px;height:34px;border-radius:9px}
  .sk-cd{height:26px;width:70%;margin-bottom:12px}
  .sk-bar{height:5px;margin-bottom:14px}
  .sk-px{height:46px;flex:1;border-radius:9px}

  .empty{grid-column:1/-1;text-align:center;color:var(--faint);font-family:var(--mono);font-size:13px;padding:40px;line-height:1.7}

  .note{margin-top:26px;font-size:12px;color:var(--faint);text-align:center}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><img src="../../apps/platform/public/logo.png" alt="Sneakers" /><small>Markets</small></div>
      <div class="status">
        <span class="live"><span class="dot"></span><span id="liveCount">—</span> live</span>
        <button class="refresh" id="refresh">↻ Refresh</button>
      </div>
    </header>

    <div class="toolbar" id="filters">
      <button class="chip ivl active" data-ivl="all">All</button>
      <button class="chip ivl" data-ivl="300">5M</button>
      <button class="chip ivl" data-ivl="600">10M</button>
      <button class="chip ivl" data-ivl="900">15M</button>
      <span class="sep"></span>
      <button class="chip ven active" data-venue="all">All sites</button>
      <button class="chip ven" data-venue="polymarket">Polymarket</button>
      <button class="chip ven" data-venue="kalshi">Kalshi</button>
      <span class="count" id="count"></span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="note" id="note"></div>
  </div>

<script>
(function(){
  "use strict";
  const grid=document.getElementById("grid");
  const VENUE={
    polymarket:{nm:"Polymarket",logo:"../../apps/platform/public/SneakersLogos/partners/polymarket.png"},
    kalshi:{nm:"Kalshi",logo:"../../apps/platform/public/SneakersLogos/partners/kalshi.png"}
  };
  const ICON={
    BTC:"linear-gradient(135deg,#F7931A,#ffb454)", ETH:"linear-gradient(135deg,#6f7bdc,#aab2ff)",
    SOL:"linear-gradient(135deg,#14F195,#9945FF)",  XRP:"linear-gradient(135deg,#64748b,#94a3b8)",
    DOGE:"linear-gradient(135deg,#c2a633,#e6c84f)", BNB:"linear-gradient(135deg,#F3BA2F,#ffd766)",
    HYPE:"linear-gradient(135deg,#0bbf9b,#5be0c6)"
  };
  let MARKETS=[], filter="all", venueFilter="all", lastFetch=0;
  // Time base from the feed's server clock (local machine clock may be skewed).
  let serverNow=0, localAtFetch=0;
  const realNow=()=> serverNow ? serverNow + (Date.now()-localAtFetch) : Date.now();

  const ivlLabel=s=>({300:"5M",600:"10M",900:"15M",3600:"1H"}[s]||Math.round(s/60)+"M");
  const fmt=s=>{ if(s<=0) return "settling"; const m=Math.floor(s/60),x=s%60; return m+":"+String(x).padStart(2,"0"); };
  const closesIn=m=>Math.round((m.endMs-realNow())/1000);
  const statusOf=m=>{ const c=closesIn(m); if(c<=0) return "settling"; if(realNow()<m.startMs) return "upcoming"; return "live"; };

  async function fetchMarkets(){
    const r=await fetch("/api/markets",{cache:"no-store"});
    if(!r.ok) throw new Error("feed "+r.status);
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    lastFetch=j.fetchedAt||Date.now();
    serverNow=j.now||j.fetchedAt||Date.now(); localAtFetch=Date.now();
    return (j.markets||[]).map(x=>({
      asset:x.asset, ivl:x.intervalSec, slug:x.id, title:x.title, venue:x.venue||"polymarket",
      endMs:Date.parse(x.endDate), startMs:Date.parse(x.startDate), yes:Math.round(x.up*100)
    })).filter(m=>m.endMs && m.yes>=0 && m.yes<=100);
  }

  function skeleton(){
    grid.innerHTML="";
    for(let i=0;i<8;i++){
      const c=document.createElement("div"); c.className="card skel";
      c.innerHTML=`<div class="c-top"><div class="sk sk-icon"></div><div class="sk sk-line" style="flex:1;margin:0"></div></div>
        <div class="sk sk-line" style="width:55%"></div><div class="sk sk-cd"></div><div class="sk sk-bar"></div>
        <div class="c-prices"><div class="sk sk-px"></div><div class="sk sk-px"></div></div>`;
      grid.appendChild(c);
    }
    document.getElementById("liveCount").textContent="…";
    document.getElementById("count").textContent="loading live markets…";
    document.getElementById("note").textContent="";
  }

  function render(){
    grid.innerHTML="";
    const shown=MARKETS.filter(m=>(filter==="all"||String(m.ivl)===filter)&&(venueFilter==="all"||m.venue===venueFilter));
    if(!shown.length){ grid.innerHTML='<div class="empty">No live markets for this filter right now.</div>'; }
    shown.forEach(m=>{
      const yesLead=m.yes>=50, status=statusOf(m), c=closesIn(m), v=VENUE[m.venue]||VENUE.polymarket;
      const pct=Math.max(0,Math.min(100,100*(1-c/m.ivl)));
      const card=document.createElement("div"); card.className="card"; card.dataset.ivl=m.ivl;
      card.innerHTML=`
        <div class="c-top">
          <span class="c-icon" style="background:${ICON[m.asset]||'linear-gradient(135deg,#64748b,#94a3b8)'}">${m.asset.slice(0,3)}</span>
          <span class="c-name">${m.asset} Up/Down</span>
          <span class="c-ivl">${ivlLabel(m.ivl)}</span>
        </div>
        <div class="c-src">
          <img src="${v.logo}" alt="${v.nm}" />
          <span class="nm">${v.nm}</span>
          <span class="badge ${status}">${status}</span>
        </div>
        <div class="c-clock"><span class="lbl">closes in</span><span class="cd" data-cd>${fmt(c)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="c-prices">
          <span class="px yes${yesLead?' lead':''}">YES<b><span class="num">.${String(m.yes).padStart(2,'0')}</span></b></span>
          <span class="px no${!yesLead?' lead':''}">NO<b><span class="num">.${String(100-m.yes).padStart(2,'0')}</span></b></span>
        </div>`;
      grid.appendChild(card);
      m._cd=card.querySelector("[data-cd]"); m._bar=card.querySelector(".bar > i");
      m._yesPx=card.querySelector(".px.yes"); m._noPx=card.querySelector(".px.no");
      m._yesNum=card.querySelector(".px.yes .num"); m._noNum=card.querySelector(".px.no .num");
    });
    const pm=MARKETS.filter(m=>m.venue==="polymarket").length, ka=MARKETS.filter(m=>m.venue==="kalshi").length;
    document.getElementById("liveCount").textContent=MARKETS.filter(m=>statusOf(m)==="live").length;
    document.getElementById("count").textContent=shown.length+" shown · Polymarket "+pm+" · Kalshi "+ka;
    document.getElementById("note").textContent="● Live — Polymarket (5m+15m) + Kalshi (15m). Countdowns real-time, prices polled every 6s.";
  }

  function flash(px,up){
    if(!px) return;
    px.classList.remove("tick-up","tick-down"); void px.offsetWidth;
    px.classList.add(up?"tick-up":"tick-down");
    setTimeout(()=>px.classList.remove("tick-up","tick-down"),440);
  }

  // real countdown + progress every second (from real endMs)
  function tick(){
    MARKETS.forEach(m=>{
      if(!m._cd||!m._cd.isConnected) return;
      const c=closesIn(m);
      m._cd.textContent=fmt(c); m._cd.classList.toggle("soon",c<=10&&c>0);
      if(m._bar) m._bar.style.width=Math.max(0,Math.min(100,100*(1-c/m.ivl)))+"%";
    });
  }

  // poll real prices; flash the ones that actually moved; re-render if the window set rolled
  async function poll(){
    let fresh; try{ fresh=await fetchMarkets(); }catch(e){ return; }
    const bySlug=new Map(MARKETS.map(m=>[m.slug,m]));
    let rolled = fresh.length!==MARKETS.length || !fresh.every(f=>bySlug.has(f.slug));
    if(rolled){ MARKETS=fresh; render(); return; }
    fresh.forEach(f=>{
      const cur=bySlug.get(f.slug); if(!cur||!cur._yesNum||!cur._yesNum.isConnected) return;
      if(f.yes!==cur.yes){
        const up=f.yes>cur.yes; cur.yes=f.yes;
        cur._yesNum.textContent="."+String(f.yes).padStart(2,"0");
        cur._noNum.textContent="."+String(100-f.yes).padStart(2,"0");
        const yesLead=f.yes>=50;
        cur._yesPx.classList.toggle("lead",yesLead); cur._noPx.classList.toggle("lead",!yesLead);
        flash(cur._yesPx,up); flash(cur._noPx,!up);
      }
    });
  }

  async function load(){
    skeleton();
    try{ MARKETS=await fetchMarkets(); render(); }
    catch(e){
      grid.innerHTML='<div class="empty">Couldn\'t reach the live feed.<br>Start the proxy: <b>python3 docs/prototypes/markets-proxy.py</b><br>then open this page via <b>http://127.0.0.1:8765/...</b> (not file://).</div>';
      document.getElementById("liveCount").textContent="0";
      document.getElementById("count").textContent=""; document.getElementById("note").textContent="";
    }
  }

  document.getElementById("filters").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    if(b.dataset.ivl!==undefined){
      [...document.querySelectorAll(".chip.ivl")].forEach(c=>c.classList.toggle("active",c===b)); filter=b.dataset.ivl;
    } else if(b.dataset.venue!==undefined){
      [...document.querySelectorAll(".chip.ven")].forEach(c=>c.classList.toggle("active",c===b)); venueFilter=b.dataset.venue;
    }
    render();
  });
  document.getElementById("refresh").addEventListener("click",load);

  load();
  setInterval(tick,1000);
  setInterval(poll,6000);
})();
</script>
</body>
</html>
